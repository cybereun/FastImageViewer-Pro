name: Build and publish FastImage Pro release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build

      - name: Build Windows Pro portable app and installer
        run: npm run electron:build:pro

      - name: Verify Pro package metadata
        shell: pwsh
        run: |
          node scripts/verify-package.mjs "dist-electron-pro/win-unpacked/resources/app.asar"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "const asar=require('@electron/asar'); const p=JSON.parse(asar.extractFile('dist-electron-pro/win-unpacked/resources/app.asar','package.json')); if (p.edition !== 'pro') throw new Error('The packaged edition is not Pro.');"

      - name: Validate release version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $refType = '${{ github.ref_type }}'
          $tagVersion = if ($refType -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '' }
          if ($tagVersion -and $tagVersion -ne $packageVersion) {
            throw "Git tag $tagVersion does not match package.json version $packageVersion."
          }

      - name: Publish GitHub Pro release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem -LiteralPath dist-electron-pro -Filter 'FastImage-*-Windows-Portable.exe'
            Get-ChildItem -LiteralPath dist-electron-pro -Filter 'FastImage-*-Windows-Setup.exe'
          ) | Sort-Object Name -Unique
          if ($assets.Count -ne 2) { throw 'Both Pro portable and installer executables were required.' }
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '' }
          if (-not $tag) { $tag = "v$((Get-Content package.json -Raw | ConvertFrom-Json).version)" }
          $assetPaths = @($assets | ForEach-Object { $_.FullName })
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag @assetPaths --repo $env:GITHUB_REPOSITORY --title "FastImage Pro $tag" --notes-file CHANGELOG.md
          } else {
            gh release upload $tag @assetPaths --repo $env:GITHUB_REPOSITORY --clobber
          }
